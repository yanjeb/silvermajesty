<section class="ministries-page">
  <div class="overlay">
    <h1>Our Ministries</h1>
    <p>Serving God through worship, excellence, and community.</p>

    <div class="ministries-grid">
      <div class="ministry-card" *ngFor="let ministry of ministries">
        <img [src]="ministry.image" [alt]="ministry.name">
        <h2>{{ ministry.name }}</h2>
        <p>{{ ministry.description }}</p>
        <button>Learn More</button>
      </div>
    </div>
  </div>
</section>
